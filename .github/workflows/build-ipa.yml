name: build-ipa

# Builds an unsigned .ipa on a macOS runner, which is the only place a Mach-O
# ARM64 binary can be produced. Download the artifact and sign it yourself.
on:
  workflow_dispatch:
    inputs:
      python_release:
        description: "Python-Apple-support tag (blank = latest iOS build)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stage business layer
        run: sh ios/Scripts/stage_business.sh

      - name: Fetch CPython for iOS
        env:
          PYTHON_RELEASE: ${{ inputs.python_release }}
        run: sh ios/Scripts/fetch_python_framework.sh

      - name: Install pure-Python dependencies
        run: python3 ios/Scripts/install_site_packages.py

      - name: Verify staged payload
        run: |
          set -eu
          test -f ios/app/LingxiWorkspace/Resources/business/app.py
          test -d ios/app/LingxiWorkspace/Resources/business/templates
          test -d ios/app/LingxiWorkspace/Resources/business/static
          test -d ios/app/LingxiWorkspace/Resources/python/lib/python3.12
          test -f ios/app/LingxiWorkspace/Resources/business/ios_runtime.py
          test -f ios/app/LingxiWorkspace/Resources/business/java.py
          echo "payload ok"
          du -sh ios/app/LingxiWorkspace/Resources/business ios/app/LingxiWorkspace/Resources/python

      - name: Build unsigned app
        working-directory: ios/app
        run: |
          set -o pipefail
          xcodebuild \
            -project LingxiWorkspace.xcodeproj \
            -scheme LingxiWorkspace \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build 2>&1 | tee build.log | tail -40

      - name: Package unsigned .ipa
        working-directory: ios/app
        run: |
          set -eu
          APP="build/Build/Products/Release-iphoneos/LingxiWorkspace.app"
          test -d "$APP" || { echo "app not found"; exit 1; }
          file "$APP/LingxiWorkspace"
          lipo -info "$APP/LingxiWorkspace" || true
          rm -rf Payload LingxiWorkspace.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          # ditto keeps the extended attributes and symlinks a bundle needs.
          ditto -c -k --sequesterRsrc --keepParent Payload/LingxiWorkspace.app LingxiWorkspace-unsigned.ipa
          ls -lh LingxiWorkspace-unsigned.ipa
          unzip -l LingxiWorkspace-unsigned.ipa | head -10

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LingxiWorkspace-unsigned-ipa
          path: ios/app/LingxiWorkspace-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/app/build.log
          if-no-files-found: ignore
