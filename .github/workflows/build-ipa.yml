name: build-ipa

# Produces an unsigned .ipa. A Mach-O ARM64 binary can only be linked by the
# Apple toolchain, so this runs on a macOS runner; the artifact is then signed
# on your own machine (Sideloadly / AltStore / codesign).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          python3 --version

      - name: Stage business layer
        run: sh ios/Scripts/stage_business.sh

      - name: Fetch CPython for iOS
        run: sh ios/Scripts/fetch_python_framework.sh

      - name: Install pure-Python dependencies
        run: python3 ios/Scripts/install_site_packages.py

      - name: Verify staged payload
        run: |
          set -eu
          B=ios/app/LingxiWorkspace/Resources/business
          P=ios/app/LingxiWorkspace/Resources/python
          test -f "$B/app.py"
          test -f "$B/ios_runtime.py"
          test -f "$B/java.py"
          test -d "$B/templates"
          test -d "$B/static"
          test -d "$P/lib/python3.12"
          test -d "$P/Python.xcframework/ios-arm64"
          test -f "$P/Python.xcframework/ios-arm64/Python.framework/Python"
          echo "payload ok"
          du -sh "$B" "$P"

      - name: Build unsigned app
        working-directory: ios/app
        run: |
          set -o pipefail
          xcodebuild \
            -project LingxiWorkspace.xcodeproj \
            -scheme LingxiWorkspace \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            build 2>&1 | tee build.log | tail -60

      - name: Package unsigned .ipa
        working-directory: ios/app
        run: |
          set -eu
          APP="build/Build/Products/Release-iphoneos/LingxiWorkspace.app"
          if [ ! -d "$APP" ]; then
            echo "::error::app bundle not found at $APP"
            ls -R build/Build/Products 2>/dev/null | head -40
            exit 1
          fi
          file "$APP/LingxiWorkspace" || true
          lipo -info "$APP/LingxiWorkspace" || true
          rm -rf Payload LingxiWorkspace-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload/LingxiWorkspace.app LingxiWorkspace-unsigned.ipa
          ls -lh LingxiWorkspace-unsigned.ipa
          unzip -l LingxiWorkspace-unsigned.ipa | head -12

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: LingxiWorkspace-unsigned-ipa
          path: ios/app/LingxiWorkspace-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ios/app/build.log
          if-no-files-found: ignore
