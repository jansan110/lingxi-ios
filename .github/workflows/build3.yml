name: build3
on:
  workflow_dispatch:
    inputs:
      python_release:
        description: tag
        required: false
        default: ""
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: use input
        env:
          R: ${{ inputs.python_release }}
        run: |
          echo "input=[$R]"
          xcodebuild -version
